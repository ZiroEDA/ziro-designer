name: Deploy (Cloudflare Pages)

# Every push to main publishes the designer (designer.ziroeda.com) and the docs (docs.ziroeda.com)
# to Cloudflare Pages, the way Vercel did. The build is the same one vercel.json describes.
#
# Needs, in the repository's Settings > Secrets and variables > Actions:
#   secrets: CLOUDFLARE_API_TOKEN (a token with "Cloudflare Pages: Edit"),
#            SENTRY_AUTH_TOKEN (optional: uploads source maps)
#   variables: CLOUDFLARE_ACCOUNT_ID, and the designer's public build values
#            VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_SUPABASE_STORAGE_BUCKET,
#            VITE_CHAT_WIDGET_URL, VITE_COMMUNITY_CHAT_URL, VITE_POSTHOG_KEY, VITE_POSTHOG_HOST
# Without the token the workflow says so and stops; nothing is published.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the token is set
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set: nothing deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build the designer
        if: steps.gate.outputs.ready == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_STORAGE_BUCKET: ${{ vars.VITE_SUPABASE_STORAGE_BUCKET }}
          VITE_CHAT_WIDGET_URL: ${{ vars.VITE_CHAT_WIDGET_URL }}
          VITE_COMMUNITY_CHAT_URL: ${{ vars.VITE_COMMUNITY_CHAT_URL }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
        run: |
          # vercel.json's build.env (R2 URLs, Sentry DSN) applies here too.
          eval "$(node -e 'const e=require("./vercel.json").build.env;for(const[k,v]of Object.entries(e))console.log(`export ${k}=${JSON.stringify(v)}`)')"
          # An unset variable reaches this step as an empty string, which would hide the value in
          # designer/.env.production; pass on only the ones that are set.
          for k in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_SUPABASE_STORAGE_BUCKET \
                   VITE_CHAT_WIDGET_URL VITE_COMMUNITY_CHAT_URL VITE_POSTHOG_KEY VITE_POSTHOG_HOST SENTRY_AUTH_TOKEN; do
            [ -n "${!k}" ] || unset "$k"
          done
          pnpm -C designer build
          test -f designer/dist/index.html && test -f designer/dist/sw.js

      - name: Publish the designer
        if: steps.gate.outputs.ready == 'true'
        # From the repository root, so wrangler bundles functions/ (the GitHub sign-in routes).
        run: npx -y wrangler@4 pages deploy designer/dist --project-name ziroeda-designer --branch main --commit-hash "$GITHUB_SHA"

      - name: Build and publish the docs
        if: steps.gate.outputs.ready == 'true'
        env:
          # The docs pages load www.ziroeda.com/stats.js with this key; unset, they count nothing.
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
        run: |
          pnpm -C docs build
          # Outside the repository: wrangler would otherwise bundle the designer's functions/
          # and read its wrangler.toml.
          mkdir -p "$RUNNER_TEMP/docs-deploy" && cd "$RUNNER_TEMP/docs-deploy"
          npx -y wrangler@4 pages deploy "$GITHUB_WORKSPACE/docs/.vitepress/dist" --project-name ziroeda-docs --branch main --commit-hash "$GITHUB_SHA"
