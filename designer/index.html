<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ZiroEDA is a browser-native, open-source PCB design environment for creating schematics and board layouts with KiCad-compatible workflows." />
    <link rel="canonical" href="https://designer.ziroeda.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://designer.ziroeda.com/" />
    <meta property="og:title" content="ZiroEDA — Browser-native PCB design" />
    <meta property="og:description" content="Design schematics and PCBs in your browser with an open-source, KiCad-compatible workflow." />
    <meta property="og:site_name" content="ZIRO EDA" />
    <!-- Always revalidate the entry document so a new deploy is picked up without
         a manual hard-refresh. The hashed JS/CSS bundles it references are
         immutable, and vercel.json says so in a Cache-Control header, so only this
         file (and sw.js, which the browser revalidates on its own) is ever
         re-fetched. -->
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <!-- The tab icon. SVG so it stays sharp at every density the browser asks
         for; `href` is relative so a GitHub Pages deploy under a repo subpath
         (VITE_BASE) finds it without the base being spliced in here. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>ZiroEDA — Browser-native PCB design</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { font-family: system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
